[config]

[templates.ghostty]
input_path = '~/.config/quickshell/wisp-shell/matugen/templates/ghostty.conf'
output_path = '~/.config/ghostty/theme.conf'
post_hook = 'gdbus call --session --dest com.mitchellh.ghostty --object-path /com/mitchellh/ghostty --method org.gtk.Actions.Activate reload-config "[]" "{}"'

[templates.gtk3]
input_path = '~/.config/quickshell/wisp-shell/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/quickshell/wisp-shell/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
